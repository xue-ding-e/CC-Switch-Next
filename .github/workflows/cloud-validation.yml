name: CC WSL read-only preflight
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: cc-wsl-readonly-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'xue-ding-e/CC-Switch-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/wsl-readonly-preflight-20261022'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Query WSL metadata only
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          function Decode-Bytes([byte[]] $bytes) {
            if ($bytes.Length -eq 0) { return @{ encoding = 'empty'; text = '' } }
            if ($bytes.Length -ge 4 -and (($bytes[0] -eq 255 -and $bytes[1] -eq 254 -and $bytes[2] -eq 0 -and $bytes[3] -eq 0) -or ($bytes[0] -eq 0 -and $bytes[1] -eq 0 -and $bytes[2] -eq 254 -and $bytes[3] -eq 255))) {
              return @{ encoding = 'unknown-utf32-bom'; text = $null }
            }
            try {
            if ($bytes.Length -ge 2 -and $bytes[0] -eq 255 -and $bytes[1] -eq 254) {
              return @{ encoding = 'utf-16le-bom'; text = [Text.UnicodeEncoding]::new($false, $false, $true).GetString($bytes, 2, $bytes.Length - 2) }
            }
            if ($bytes.Length -ge 2 -and $bytes[0] -eq 254 -and $bytes[1] -eq 255) {
              return @{ encoding = 'utf-16be-bom'; text = [Text.UnicodeEncoding]::new($true, $false, $true).GetString($bytes, 2, $bytes.Length - 2) }
            }
            # WSL commonly emits BOM-less UTF-16LE to redirected handles.
            $oddZero = 0; $evenZero = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 0) { if ($i % 2) { $oddZero++ } else { $evenZero++ } }
            }
            if ($bytes.Length % 2 -eq 0 -and $oddZero -gt ($bytes.Length / 8) -and $oddZero -gt $evenZero) {
              return @{ encoding = 'utf-16le-inferred'; text = [Text.UnicodeEncoding]::new($false, $false, $true).GetString($bytes) }
            }
            if ($bytes.Length % 2 -eq 0 -and $evenZero -gt ($bytes.Length / 8) -and $evenZero -gt $oddZero) {
              return @{ encoding = 'utf-16be-inferred'; text = [Text.UnicodeEncoding]::new($true, $false, $true).GetString($bytes) }
            }
            } catch { return @{ encoding = 'unknown-invalid-utf16'; text = $null } }
            try {
              if ($bytes.Length -ge 3 -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191) {
                return @{ encoding = 'utf-8-bom'; text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes, 3, $bytes.Length - 3) }
              }
              return @{ encoding = 'utf-8'; text = [Text.UTF8Encoding]::new($false, $true).GetString($bytes) }
            } catch {
              # Never silently guess an OEM code page; raw bytes remain authoritative.
              return @{ encoding = 'unknown'; text = $null }
            }
          }
          $wsl = Join-Path $env:WINDIR 'System32\wsl.exe'
          $results = @()
          $cleanupBlocked = $false
          foreach ($query in @('--version', '--status', '--list --verbose')) {
            $record = [ordered]@{ command = "wsl.exe $query"; state = 'not_run'; exit_code = $null; elapsed_ms = 0; stdout = $null; stderr = $null }
            if ($cleanupBlocked) {
              $record.state = 'not_run_previous_cleanup_incomplete'
              $results += $record
              continue
            }
            if (-not (Test-Path -LiteralPath $wsl -PathType Leaf)) {
              $record.state = 'not_run_executable_missing'
              $results += $record
              continue
            }
            $p = [Diagnostics.Process]::new()
            $p.StartInfo = [Diagnostics.ProcessStartInfo]::new()
            $p.StartInfo.FileName = $wsl
            $p.StartInfo.Arguments = $query
            $p.StartInfo.UseShellExecute = $false
            $p.StartInfo.CreateNoWindow = $true
            $p.StartInfo.RedirectStandardInput = $true
            $p.StartInfo.RedirectStandardOutput = $true
            $p.StartInfo.RedirectStandardError = $true
            $started = $false
            $pipes = @()
            $timer = [Diagnostics.Stopwatch]::StartNew()
            try {
              if (-not $p.Start()) { throw 'Query process did not start' }
              $started = $true
              $p.StandardInput.Close()
              foreach ($name in @('stdout', 'stderr')) {
                $reader = if ($name -eq 'stdout') { $p.StandardOutput } else { $p.StandardError }
                $buffer = [byte[]]::new(4096)
                $pipe = @{ name = $name; reader = $reader; stream = $reader.BaseStream; buffer = $buffer; saved = [IO.MemoryStream]::new(); truncated = $false; eof = $false; task = $null }
                $pipes += $pipe
                $pipe.task = $pipe.stream.ReadAsync($buffer, 0, $buffer.Length)
              }
              while ($timer.ElapsedMilliseconds -lt 30000) {
                foreach ($pipe in $pipes) {
                  if (-not $pipe.eof -and $pipe.task.IsCompleted) {
                    $count = $pipe.task.GetAwaiter().GetResult()
                    if ($count -eq 0) { $pipe.eof = $true; continue }
                    $keep = [Math]::Min($count, 65536 - [int]$pipe.saved.Length)
                    if ($keep -gt 0) { $pipe.saved.Write($pipe.buffer, 0, $keep) }
                    if ($keep -lt $count) { $pipe.truncated = $true }
                    $pipe.task = $pipe.stream.ReadAsync($pipe.buffer, 0, $pipe.buffer.Length)
                  }
                }
                if ($p.HasExited -and @($pipes | Where-Object { -not $_.eof }).Count -eq 0) { break }
                Start-Sleep -Milliseconds 20
              }
              if ($p.HasExited -and @($pipes | Where-Object { -not $_.eof }).Count -eq 0) {
                $record.exit_code = $p.ExitCode
                $record.state = if ($p.ExitCode -eq 0) { 'completed_zero' } else { 'completed_nonzero' }
              } else {
                $record.state = 'timeout'
              }
            } catch {
              $record.state = 'query_error'
              $record.error = $_.Exception.Message
            } finally {
              # Also close a started query on exceptions; never kill descendants or WSL.
              if ($started) {
                try {
                  if (-not $p.HasExited) { $p.Kill($false); [void]$p.WaitForExit(2000) }
                  if ($p.HasExited) { $record.exit_code = $p.ExitCode }
                } catch { $record.cleanup_error = $_.Exception.Message }
                try {
                  if (-not $p.HasExited) { $cleanupBlocked = $true }
                } catch { $cleanupBlocked = $true }
                if ($cleanupBlocked) { $record.cleanup_incomplete = $true }
              }
              foreach ($pipe in $pipes) {
                # Closing the pipe releases any outstanding asynchronous read.
                try { $pipe.reader.Dispose() } catch { $record.cleanup_error = $_.Exception.Message }
                $settled = $true
                if ($null -ne $pipe.task) {
                  try { $settled = $pipe.task.Wait(2000) } catch { $settled = $pipe.task.IsCompleted }
                }
                if (-not $settled) { $cleanupBlocked = $true; $record.cleanup_incomplete = $true }
                $bytes = $pipe.saved.ToArray()
                $decoded = Decode-Bytes $bytes
                $capture = if (-not $settled) { 'incomplete_read_not_settled' } elseif ($pipe.truncated) { 'truncated' } elseif ($pipe.eof) { 'complete' } else { 'incomplete' }
                $record[$pipe.name] = @{ capture = $capture; raw_base64 = [Convert]::ToBase64String($bytes); byte_count = $bytes.Length; byte_limit = 65536; encoding = $decoded.encoding; text = $decoded.text }
                $pipe.saved.Dispose()
              }
              $record.elapsed_ms = $timer.ElapsedMilliseconds
              $p.Dispose()
            }
            $results += $record
          }
          $report = [ordered]@{
            schema = 1
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            windows_version = [Environment]::OSVersion.VersionString
            process_architecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            wsl_executable = $wsl
            wsl_executable_present = (Test-Path -LiteralPath $wsl -PathType Leaf)
            queries = $results
            classification = 'metadata_only_runtime_not_tested'
            distro_launch = 'not_run_by_design'
            native_cc_regression = 'not_run_by_design'
            note = 'A listed WSL2 distro does not prove it can start. Nonzero/timeout means metadata evidence is incomplete, not a product regression.'
          }
          # JSON escapes control characters; raw bytes preserve all encoding evidence.
          $report | ConvertTo-Json -Depth 10
          if (@($results | Where-Object { $_.cleanup_incomplete -or $_.state -ne 'completed_zero' -or $_.stdout.capture -ne 'complete' -or $_.stderr.capture -ne 'complete' }).Count -gt 0) {
            throw 'Read-only preflight incomplete; see query states. No installation or runtime test was attempted.'
          }
