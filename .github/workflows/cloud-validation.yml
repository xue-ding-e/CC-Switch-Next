name: Isolated replay-cache serialization validation
on:
  push:
    branches: [test/cache-isolation-20261020]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cc-replay-cache-isolation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CC_SWITCH_TEST_HOME: /tmp/cc-switch-test-home
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install existing system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          mkdir -p dist "$CC_SWITCH_TEST_HOME"
          rustc +1.95 --version
          cargo +1.95 --version
      - name: Compile and discover exact baseline probe
        run: |
          timeout 1800 cargo +1.95 test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          cargo +1.95 test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list > /tmp/tests.txt
          grep -Fx 'services::session_usage_codex::tests::test_continuation_parser_respects_replay_test_serial_lock: test' /tmp/tests.txt
          grep -Fx 'services::session_usage_codex::tests::test_parse_codex_file_recognizes_branch_thread_paginated_continuation: test' /tmp/tests.txt
          count=$(grep -c "^services::session_usage_codex::tests::.*: test$" /tmp/tests.txt)
          test "$count" -gt 70
          echo "$((count - 2))" > /tmp/original-test-count
      - name: Verify real baseline cache pollution
        shell: bash
        run: |
          set +e
          timeout 90 cargo +1.95 test --locked --manifest-path src-tauri/Cargo.toml --lib services::session_usage_codex::tests::test_continuation_parser_respects_replay_test_serial_lock -- --exact --nocapture > /tmp/cache-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/cache-red.log
          test "$rc" = 101
          grep -F 'unserialized continuation test polluted held replay cache' /tmp/cache-red.log
          grep -F '0 passed; 1 failed' /tmp/cache-red.log
      - name: Apply minimal isolation fix and prove held-cache protection
        run: |
          sed -i '/^    fn test_parse_codex_file_recognizes_branch_thread_paginated_continuation(/i\    #[serial_test::serial]' src-tauri/src/services/session_usage_codex.rs
          timeout 900 cargo +1.95 test --locked --manifest-path src-tauri/Cargo.toml --lib services::session_usage_codex::tests::test_continuation_parser_respects_replay_test_serial_lock -- --exact --nocapture
      - name: Verify original module without probe scaffolding
        run: |
          sed -i '/^    \/\/ BEGIN ISOLATED SERIALIZATION PROBE$/,/^    \/\/ END ISOLATED SERIALIZATION PROBE$/d' src-tauri/src/services/session_usage_codex.rs
          git diff --stat
          git diff -- src-tauri/src/services/session_usage_codex.rs
          timeout 900 cargo +1.95 test --locked --manifest-path src-tauri/Cargo.toml --lib services::session_usage_codex::tests:: -- --test-threads=8 | tee /tmp/module-green.log
          grep -F "$(cat /tmp/original-test-count) passed; 0 failed; 1 ignored" /tmp/module-green.log
          for n in 1 2 3 4; do
            timeout 90 cargo +1.95 test --locked --manifest-path src-tauri/Cargo.toml --lib services::session_usage_codex::tests:: -- --test-threads=8 | tee /tmp/module-green.log
            grep -F "$(cat /tmp/original-test-count) passed; 0 failed; 1 ignored" /tmp/module-green.log
          done
          sha256sum src-tauri/src/services/session_usage_codex.rs
          echo "7ca166c91049534b69d3f3ddeaeb6cb71a5f8d4bf6b3a4197fa9d83a0a3a54b5  src-tauri/src/services/session_usage_codex.rs" | sha256sum --check
