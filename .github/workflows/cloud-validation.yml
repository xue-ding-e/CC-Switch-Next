name: Cloud validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloud-validation-agy-empty-export
  cancel-in-progress: false
jobs:
  agy-empty-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify repository, validation branch, and reviewed dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = xue-ding-e/CC-Switch-Next
          test "$ACTUAL_REF" = refs/heads/validation/agy-empty-export-r2-20261025
          test "$PRIVATE_REPOSITORY" = false
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Check out reviewed validation scaffolding only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          path: validation
      - name: Verify validation-only delta and script
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        working-directory: validation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = 3303b11fb8ec49abe4075c7abdbeba7457827e6e
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' \
            .github/workflows/cloud-validation.yml \
            .validation/agy-empty-export/fix.patch \
            .validation/agy-empty-export/regression.patch \
            .validation/agy-empty-export/run.sh | LC_ALL=C sort)"
          printf '%s  %s\n' 15362f5477a731919a9249d8c8fd507b5d2c245e286098161b68e68171823e49 .validation/agy-empty-export/run.sh | sha256sum --check --strict -
          printf '%s  %s\n' 7fd95015b57c8cf9e6e729072995337b00239d5d43a1731c0b6f7ad6b612c7f4 .validation/agy-empty-export/fix.patch | sha256sum --check --strict -
          printf '%s  %s\n' 8bde279382b977eb6ec8cdc9636d14344f521e8724f0470fea9003f78c81af4d .validation/agy-empty-export/regression.patch | sha256sum --check --strict -
      - name: Check out exact upstream PR source as inert files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: farion1231/cc-switch
          ref: 1729263841a78d4c1d6f21874f6b01448abf7683
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Install only Linux backend prerequisites
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: Exact-source RED then GREEN, with synthetic profiles only
        timeout-minutes: 34
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cc-agy-empty-export"
          mkdir -p "$root"/{home,config,data,cache,state,tmp,cargo,rustup,target}
          rustup_bin=$(command -v rustup)
          timeout --kill-after=30s 32m env -i \
            HOME="$root/home" CC_SWITCH_TEST_HOME="$root/home" \
            XDG_CONFIG_HOME="$root/config" XDG_DATA_HOME="$root/data" \
            XDG_CACHE_HOME="$root/cache" XDG_STATE_HOME="$root/state" TMPDIR="$root/tmp" \
            CARGO_HOME="$root/cargo" RUSTUP_HOME="$root/rustup" CARGO_TARGET_DIR="$root/target" \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 CI=true TERM=dumb \
            CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 \
            CARGO_INCREMENTAL=0 CARGO_TERM_COLOR=never RUST_BACKTRACE=0 \
            bash --noprofile --norc "$GITHUB_WORKSPACE/validation/.validation/agy-empty-export/run.sh" \
            "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/validation/.validation/agy-empty-export" "$rustup_bin"
