name: Cloud validation (MiniMax candidate only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed control commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cc-minimax-validation
  cancel-in-progress: false
jobs:
  parser:
    if: github.repository == 'xue-ding-e/CC-Switch-Next' && github.ref == 'refs/heads/validation/minimax-8124-20261028' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed control
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
          ref: ${{ github.sha }}
      - name: Verify immutable control checkout
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_CONTROL_SHA" = "$GITHUB_SHA"
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          repository: xue-ding-e/CC-Switch-Next
          ref: bd416383d971e302ed059ae7ada73fd57429ab26
          persist-credentials: false
          path: source
      - name: Verify synthetic control gates (not product tests)
        timeout-minutes: 1
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: timeout 10s python3 control/scripts/test_validate_minimax.py
      - name: Install backend build dependencies only
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          rustup toolchain install 1.95 --profile minimal --component rustfmt
          test "$(git -C source rev-parse HEAD)" = bd416383d971e302ed059ae7ada73fd57429ab26
          rustc +1.95 --version
          df -h .
          free -m
      - name: Compile once and verify actual parser tests
        timeout-minutes: 47
        env:
          RUSTUP_TOOLCHAIN: '1.95'
        run: |
          set -euo pipefail
          ulimit -c 0
          ulimit -n 4096
          # RLIMIT_AS is per process, not aggregate RSS. Driver additionally samples
          # the dedicated process group about every 0.2s and aborts above 6 GiB.
          # Sampling is not a hard RSS limit: short-lived peaks may be missed.
          ulimit -v 6291456
          unset PYTHONOPTIMIZE
          /usr/bin/time -v python3 control/scripts/validate-minimax.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/minimax-evidence" 2> "$RUNNER_TEMP/minimax-resources.log"
      - name: Upload bounded verification evidence (not binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimax-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/minimax-evidence/*.json
            ${{ runner.temp }}/minimax-evidence/*.log
            ${{ runner.temp }}/minimax-resources.log
