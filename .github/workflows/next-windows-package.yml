name: Next Windows installer
on:
  push:
    branches: [main, maintenance/next-installers-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-package-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/cloud-validation.yml
  package:
    needs: validation
    if: github.repository == 'xue-ding-e/CC-Switch-Next'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked frontend dependencies
        shell: pwsh
        run: |
          npm install --global corepack@0.31.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check source and Next isolation
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          if (git status --porcelain) { throw 'Dirty checkout' }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.productName -ne 'CC Switch Next' -or $config.identifier -ne 'io.github.xue-ding-e.cc-switch-next' -or $config.bundle.createUpdaterArtifacts -or $config.plugins.updater -or @($config.plugins.'deep-link'.desktop.schemes).Count -ne 1 -or $config.plugins.'deep-link'.desktop.schemes[0] -ne 'ccswitch-next' -or $config.bundle.licenseFile -ne '../LICENSE') { throw 'Next installer/update isolation mismatch' }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run src/lib/updater.next.test.ts --maxWorkers=1 --minWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Rust and check backend guard
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $channel) { throw 'Missing Rust pin' }
          rustup toolchain install $channel --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          "CC_SWITCH_TEST_HOME=$(Join-Path $env:RUNNER_TEMP 'cc-switch-next-test-home')" >> $env:GITHUB_ENV
      - name: Run native updater guard
        shell: pwsh
        run: |
          foreach ($testName in @('commands::settings::next_distribution_tests::next_distribution_requires_manual_updates', 'deeplink::tests::test_parse_next_scheme_preserves_provider_identity')) {
          $listed = @(cargo test --locked --manifest-path src-tauri/Cargo.toml --lib $testName -- --list)
          if ($LASTEXITCODE -ne 0 -or @($listed | Where-Object { $_ -ceq "$testName`: test" }).Count -ne 1) { throw 'Missing exact native guard test' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib $testName -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build NSIS installer without upstream updater signing
        shell: pwsh
        run: |
          pnpm tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path src-tauri/target/release/cc-switch-next.exe)) { throw 'Missing isolated Next executable' }
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($files.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'cc-switch-next-install-smoke'
          $legacyBefore = Get-ItemProperty 'HKCU:\Software\Classes\ccswitch\shell\open\command' -ErrorAction SilentlyContinue | ConvertTo-Json -Compress
          $installer = Start-Process -FilePath $files[0].FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $installer.WaitForExit(180000)) { $installer.Kill(); throw 'Installer smoke timed out' }
          if ($installer.ExitCode -ne 0) { throw 'Silent installer smoke failed' }
          $installedExe = Join-Path $installDir 'cc-switch-next.exe'
          if (-not (Test-Path $installedExe)) { throw 'Isolated installed executable missing' }
          if ((Get-FileHash $installedExe -Algorithm SHA256).Hash -ne (Get-FileHash src-tauri/target/release/cc-switch-next.exe -Algorithm SHA256).Hash) { throw 'Installed executable differs from built source artifact' }
          $nextHandler = (Get-ItemProperty 'HKCU:\Software\Classes\ccswitch-next\shell\open\command' -ErrorAction Stop).'(default)'
          if (-not $nextHandler.Contains($installedExe)) { throw 'Next protocol handler points to another executable' }
          $legacyAfter = Get-ItemProperty 'HKCU:\Software\Classes\ccswitch\shell\open\command' -ErrorAction SilentlyContinue | ConvertTo-Json -Compress
          if ($legacyBefore -ne $legacyAfter) { throw 'Installer changed upstream protocol handler' }
          New-Item -ItemType Directory -Force next-package | Out-Null
          $name = "CC-Switch-Next-$($env:GITHUB_SHA.Substring(0,12))-Windows-x64-Setup.exe"
          Copy-Item $files[0].FullName "next-package/$name"
          $hash = (Get-FileHash "next-package/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii next-package/SHA256SUMS
          @{repository=$env:GITHUB_REPOSITORY; source_sha=$env:GITHUB_SHA; installer=$name; sha256=$hash; signed=$false; validation='Updater isolation tests, NSIS build and isolated silent installation/file-hash smoke; GUI interaction not validated'} | ConvertTo-Json | Set-Content -Encoding utf8 next-package/manifest.json
          Copy-Item LICENSE next-package/LICENSE
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed' }
      - uses: actions/upload-artifact@v4
        with:
          name: cc-switch-next-windows-${{ github.sha }}
          path: next-package/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    if: github.repository == 'xue-ding-e/CC-Switch-Next' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cc-switch-next-windows-${{ github.sha }}
          path: package
      - name: Verify checksums and publish immutable Next release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify main' }
          if ($head -ne $env:GITHUB_SHA) { Write-Output 'Newer main exists; retain last good public release'; exit 0 }
          $sumLines = @(Get-Content package/SHA256SUMS | Where-Object { $_.Trim() })
          if ($sumLines.Count -ne 1 -or $sumLines[0] -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum manifest' }
          $hash = $Matches[1]; $assetName = $Matches[2]
          $asset = Join-Path 'package' $assetName
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Artifact checksum mismatch' }
          $manifest = Get-Content package/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:GITHUB_SHA -or $manifest.repository -ne $env:GITHUB_REPOSITORY) { throw 'Package source identity mismatch' }
          $tag = "next-$($env:GITHUB_SHA.Substring(0,12))"
          $notes = "CC Switch Next Windows x64. Source: $env:GITHUB_SHA. Independently maintained Next build; unsigned. Close the upstream app before use and back up its configuration. Shared data locations are retained; simultaneous use is not validated. Manual updates only from this repository. Validation: $($manifest.validation)."
          $notes += ' Run the Setup.exe. Existing custom database-directory overrides are not migrated across app identities: record the old directory and select it again in Next settings. The registered link scheme is ccswitch-next, not ccswitch.'
          $refsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tag refs' }
          $refs = @($refsJson | ConvertFrom-Json | Where-Object { $_.ref -ceq "refs/tags/$tag" })
          if ($refs.Count -eq 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create source-pinned release tag' }
          }
          $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release tag' }
          $object = ($refJson | ConvertFrom-Json).object
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 5; $depth++) {
            $tagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot dereference annotated tag' }
            $object = ($tagJson | ConvertFrom-Json).object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $env:GITHUB_SHA) { throw 'Release tag points to another source' }
          $existing = gh release view $tag -R $env:GITHUB_REPOSITORY --json isDraft,body 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.body.Contains($env:GITHUB_SHA)) { throw 'Existing tag belongs to a different source' }
            if (-not $release.isDraft) { Write-Output 'Immutable release already published'; exit 0 }
          } else {
            gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "CC Switch Next $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          }
          gh release upload $tag -R $env:GITHUB_REPOSITORY $asset package/SHA256SUMS package/manifest.json package/LICENSE --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed' }
          New-Item -ItemType Directory -Force verify | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY --pattern $assetName --dir verify
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path verify $assetName) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Published asset readback mismatch' }
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot recheck main before publication' }
          if ($head -ne $env:GITHUB_SHA) { Write-Output 'Main advanced; leave this release draft'; exit 0 }
          gh release edit $tag -R $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
